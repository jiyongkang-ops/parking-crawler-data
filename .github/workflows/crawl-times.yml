# タイムズ専用の定期実行（GitHub Actions）
# 2026-09: 詳細ページの「周辺の駐車場」一覧（本駐車場＋最大10件）から満空も読むようにした。
#   同じページから読むので取得回数は増えない。1ページで最大11件ぶんの満空観測が入る。
# タイムズは全国 約22,000件 × 配慮した6秒間隔のため1巡が長く、ジョブ時間も長い。
# 本体(crawl.yml)と分離し、出力先も別ファイル(prices-times.jsonl)にして push 競合を回避。
#   1回90分で切り上げる（ROLLING_BUDGET_MIN）→ 1回 約900件・1日3回で約2,700件
#   → 優先物件（約620件・おおむね1日1回）の取り直しを入れて、約10日で全国1巡（優先なしなら約8日）。
#   2026-10-17 まで: ROLLING_BUDGET_MIN が無く既定の45分で切り上げていたので、1回 約450件・約16日で1巡だった
#   （ここのコメントは「毎回3,000件・約5時間・約2.4日で1巡」のままだった）。本人の了解は「1回90分（負荷は今の約2倍）」。
name: crawl-times

# 起動は本体の巡回（crawl.yml、Cloud Scheduler から毎時07分JST）が、1日3回（昼9〜14時・夕方15〜20時・夜〜朝21〜翌8時を日ごとにずらす）
# の回に workflow_dispatch で行う（2026-10-01〜8時間おき、2026-10-17〜昼と夕方を厚く）。
# GitHub の cron は約5時間遅れて始まり、日中の満空が1回も取れなかったので止めた（2026-09-27）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl-times:
    runs-on: ubuntu-latest
    # 取得90分（クローラ側で切り上げ）＋ npm ci・一覧の作り直し（7日に1回）・コミットと push のやり直しで数分
    # （実測: 45分の予算のころは1回46〜49分。前後は4分以内）。ここで殺されるとコミットの手順が動かず、
    # その回の観測が丸ごと消えるので、30分の余裕を見る（2026-10-17。以前は350分）。
    # 起動（crawl.yml）の回と回の間は最短6時間なので、120分かかっても次の回とは重ならない（2年分を計算で確認）
    timeout-minutes: 120
    concurrency:
      group: crawl-times
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "times"
          OUT_FILE: "data/prices-times.jsonl"
          # 1回の取得の予算（分）。以前は書いておらず既定の45分だった（2026-10-17 本人の了解で90分）。
          # 毎時の巡回（crawl.yml の NPC・リパーク）は別の値（50分）で、ここを変えても影響しない
          ROLLING_BUDGET_MIN: "90"
          # 1回にまとめて取る（間に25分の待ちを入れない）。タイムズは既定だと2回に分けるが、これまでも
          # 1回目の途中で予算が尽きて2回目は一度も動いていなかった。1回900件にすると2回目が動き出し、
          # 待ちの25分だけジョブが延びる（取れる件数は増えない）ので、1回に固定する（2026-10-17）
          ROLLING_PASSES: "1"
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 列挙失敗でファイルが無い社があっても他社のデータを失わないよう data/ 配下をまとめて追加
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update times prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
