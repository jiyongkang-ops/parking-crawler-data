# タイムズ専用の定期実行（GitHub Actions）
# 2026-09: 詳細ページの「周辺の駐車場」一覧（本駐車場＋最大10件）から満空も読むようにした。
#   同じページから読むので取得回数は増えない。1ページで最大11件ぶんの満空観測が入る。
# タイムズは全国 約21,700件 × 配慮した6秒間隔のため1巡が長く、ジョブ時間も長い。
# 本体(crawl.yml)と分離し、出力先も別ファイル(prices-times.jsonl)にして push 競合を回避。
#   毎回 3,000件ローリング（約5時間）→ 約2.4日で全国1巡。
name: crawl-times

# 起動は本体の巡回（crawl.yml、Cloud Scheduler から毎時07分JST）が JST 10・14・21時の回に workflow_dispatch で行う。
# GitHub の cron は約5時間遅れて始まり、日中の満空が1回も取れなかったので止めた（2026-09-27）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl-times:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: crawl-times
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "times"
          OUT_FILE: "data/prices-times.jsonl"
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 列挙失敗でファイルが無い社があっても他社のデータを失わないよう data/ 配下をまとめて追加
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update times prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
