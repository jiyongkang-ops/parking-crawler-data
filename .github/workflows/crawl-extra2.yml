# 2026-08 追加分の定期実行（スペース二十四・JQパークス・パークネット）
# 出力は別ファイル(prices-extra2.jsonl)にして push 競合を回避。
name: crawl-extra2

on:
  schedule:
    # 他ワークフローとずらして 5:30,17:30 UTC（1日2回）
    - cron: "30 5,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl-extra2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: crawl-extra2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "space24,jqparks,parknet"
          OUT_FILE: "data/prices-extra2.jsonl"
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/prices-extra2.jsonl data/space24-ids.txt data/space24-crawl-state.json data/jqparks-ids.txt data/jqparks-crawl-state.json data/parknet-cities.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update extra2 prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
