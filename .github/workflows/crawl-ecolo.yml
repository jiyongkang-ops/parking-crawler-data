# エコロパーク（エコロシティ）の定期実行
# 出力は別ファイル(prices-ecolo.jsonl)にして push 競合を回避。
name: crawl-ecolo

# 起動は crawl.yml の dispatch ジョブ（Cloud Scheduler から毎時07分JST）が、JST 1・13・19時に workflow_dispatch で行う
# （2026-10-18〜）。両方あると同じ回が2回走るので cron は外した（時刻表と守りは crawl.yml の dispatch ジョブ）。
# それまでの GitHub の cron（"0 4,10,16 * * *" = JST 13・19・1時）は中央値で約4時間（長いと約7時間）遅れて始まり、
# 2026-10-04〜10-13 は毎日1回落ちて1日2回だった（14日で予定42回のうち32回）。
on:
  workflow_dispatch: {} # crawl.yml の dispatch ジョブと手動実行から

permissions:
  contents: write

jobs:
  crawl-ecolo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: crawl-ecolo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # exec で node を手順のいちばん上のプロセスにする（中身は package.json の crawl と同じ）。ランナーは時間切れ・取り消しのとき
      # 手順のいちばん上にだけ SIGINT を送るので、npm run crawl だと node に届かず、止めた後も取得と追記が続いていた（2026-10-18 点検）。
      # node は SIGINT を受けると、そこまでの巡回状態と health（巡回全体 NG）を書いてすぐ終わる（src/run.js の最後）
      - run: exec node src/run.js
        # ジョブの時間切れ（350分）より10分早く巡回を止め、下のコミットの手順の時間を残す。
        # ジョブごと時間切れにすると、コミットの手順の時間が残らず、その回の観測を失うおそれがある（2026-10-18）
        timeout-minutes: 340
        env:
          CRAWL_ONLY: "ecolo"
          OUT_FILE: "data/prices-ecolo.jsonl"
      - name: commit data if changed
        if: always()   # 途中で殺されても、そこまでの観測は残す
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 巡回（node）が残っていたら止めてから git add する。ふつうは上の exec で巡回の手順と一緒に終わっているが、
          # 残っていると git pull の間も満空の共有ファイルに追記し続け、pull とコミットが失敗する（2026-10-18 点検）
          if pkill -INT -f 'node src/run.js'; then
            for i in $(seq 1 20); do pgrep -f 'node src/run.js' >/dev/null || break; sleep 1; done
            pkill -KILL -f 'node src/run.js' || true
          fi
          # 列挙失敗でファイルが無い社があっても他社のデータを失わないよう data/ 配下をまとめて追加
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ecolo prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
