# 追加3社（キョウテク・NTTル・パルク・GSパーク）の定期実行
# 合計 約2,000物件・毎回全件相当（~1,300リクエスト×6秒 ≒ 2.2時間）。
# 出力は別ファイル(prices-extra.jsonl)にして push 競合を回避。
name: crawl-extra

on:
  schedule:
    # 他ワークフローとずらして 2:30,14:30 UTC（1日2回）
    - cron: "30 2,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: crawl-extra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "kyotech,leparc,gspark"
          OUT_FILE: "data/prices-extra.jsonl"
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 列挙失敗でファイルが無い社があっても他社のデータを失わないよう data/ 配下をまとめて追加
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update extra (kyotech/leparc/gspark) prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
