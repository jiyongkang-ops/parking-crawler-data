# 派生物（dashboard.html・統一料金CSV）を1日1回作り直す。
# もとは毎時の巡回のたびに作ってコミットしていたが、14MB＋17MBの派生物を
# 1日24回コミットすると、それだけで git が月75MB・年1GB近く太る。
# 中身は data/ からいつでも作り直せるので、日次で足りる。
name: publish

# 起動は crawl.yml の dispatch ジョブ（Cloud Scheduler から毎時07分JST）が、毎日 JST 6時に workflow_dispatch で行う
# （2026-10-18〜）。両方あると同じ回が2回走るので cron は外した（時刻表と守りは crawl.yml の dispatch ジョブ）。
# それまでの GitHub の cron（"40 21 * * *" = JST 6:40。studio-data の 7:30 より前のつもり）は中央値で約3時間（長いと5時間）遅れて、
# 実際は JST 8〜11時に動いていた。7時台にすると studio-data（7:30）に近すぎるので、6時にした。
on:
  workflow_dispatch: {} # crawl.yml の dispatch ジョブと手動実行から

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run dashboard
      - run: npm run export
      - name: commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dashboard.html data/parking-latest.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish dashboard + csv ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              git pull --no-rebase --no-edit origin main || { git checkout --ours -- dashboard.html data/parking-latest.csv; git add -A; git commit --no-edit; }
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
