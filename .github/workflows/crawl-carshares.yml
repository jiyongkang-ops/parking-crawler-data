# 三井のカーシェアーズのステーション一覧（場所・台数・車種クラス）を週1回で1巡する。
# 公開の「ステーションを探す」だけをたどる（予約・空き状況の会員ページには触れない）。src/carshares.js を参照。
# 1巡は約5,000ページ×3秒で約4時間。1回の実行は200分で切り上げて続きは翌日に回し、
# 1巡が終わってから7日たつまでは何もしない（毎日起動しても、実際に取るのは週に1〜2回）。
# 週1なので遅れて始まっても困らないが、ほかの巡回とそろえて crawl.yml から起動する（2026-10-18〜）。
name: crawl-carshares

# 起動は crawl.yml の dispatch ジョブ（Cloud Scheduler から毎時07分JST）が、毎日 JST 3時に workflow_dispatch で行う
# （2026-10-18〜）。両方あると同じ回が2回走るので cron は外した（時刻表と守りは crawl.yml の dispatch ジョブ）。
# それまでの GitHub の cron（"0 18 * * *" = JST 3:00）は回数は足りていたが、中央値で約4時間（長いと約6.5時間）遅れて始まっていた。
on:
  workflow_dispatch: {} # crawl.yml の dispatch ジョブと手動実行から

permissions:
  contents: write

jobs:
  crawl-carshares:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    concurrency:
      group: crawl-carshares
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # exec で node を手順のいちばん上のプロセスにする（ほかの巡回と同じ）。ランナーは時間切れ・取り消しのとき
      # 手順のいちばん上にだけ SIGINT を送るので、そのままだと node に届かないことがある（2026-10-19 の最終点検）。
      # node は SIGINT を受けると、そこまでの巡回状態を書いてすぐ終わる（src/carshares.js の最後）
      - run: exec node src/carshares.js
        # ジョブの時間切れ（230分）より10分早く巡回を止め、下のコミットの手順の時間を残す（ほかの巡回と同じ）。
        # ふつうは CARSHARE_BUDGET_MIN（200分）で自分から切り上げる
        timeout-minutes: 220
        env:
          CARSHARE_BUDGET_MIN: "200"
          CARSHARE_CYCLE_DAYS: "7"
      - name: commit data if changed
        if: always()   # 途中で殺されても、そこまでの観測は残す
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 巡回（node）が残っていたら止めてから git add する。ふつうは上の exec で巡回の手順と一緒に終わっているが、
          # 残っていると git pull の間も状態ファイルやステーションの一覧に書き続け、pull とコミットが失敗する（ほかの巡回と同じ）
          if pkill -INT -f 'node src/carshares.js'; then
            for i in $(seq 1 20); do pgrep -f 'node src/carshares.js' >/dev/null || break; sleep 1; done
            pkill -KILL -f 'node src/carshares.js' || true
          fi
          # 列挙失敗でファイルが無い社があっても他社のデータを失わないよう data/ 配下をまとめて追加
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update carshares stations ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
