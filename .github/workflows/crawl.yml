# クラウド定期実行（GitHub Actions）
# この2社だけは満空（空車/混雑/満車）が取れるので、1時間おきに回す。
#   - NPC全国: 毎回 約1,700件を1リクエストで取得 → 24時間×7曜日がそのまま埋まる
#   - repark全国: 毎回 約630件をローリング巡回（config.reparkRollingCycleRuns=25）
#
# なぜ細かく回すのか:
#   在車率は時間帯と曜日で大きく変わる。1日3回（9/15/21時）のままだと同じ物件を
#   いつも似た時刻に見ることになり、平均が昼の顔に寄る。
#   ただし GitHub の定時実行は混雑時に2〜3時間ずれる（実測）ので、実行時刻には頼らない。
#   リパークは「今の時刻をまだ見ていない物件」から先に回す（pickRolling の spreadHours）。
#   いつ走ろうと24時間ぶんの穴が順に埋まる。
#
# 先方への負荷は増やしていない。1日あたりの件数はほぼ同じ（13,500→約15,100件）で、
# まとめて3.3時間叩くのをやめ、1時間に約630件へならしている（山が低くなる）。
# 収集結果と巡回状態(data/)に変化があればコミットして次回に引き継ぐ。
name: crawl-parking-prices

on:
  schedule:
    # 毎時23分。cron は UTC だが毎時なので時差の影響を受けない。
    # 0分ちょうどは世界中の定時実行が集中してGitHub側の遅れが大きいので避ける。
    # それでも実行は2〜3時間ずれることがある。時間帯をそろえる仕掛けは実行時刻に
    # 頼らず、クローラ側（pickRolling の spreadHours）で担保している。
    - cron: "23 * * * *"
  workflow_dispatch: {} # 手動実行も可

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 1回は約30分の見込み。次の実行（1時間後）に食い込まないよう55分で打ち切る。
    timeout-minutes: 55
    concurrency:
      group: crawl # 多重起動を防ぐ（節度）
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "npc,repark" # タイムズは crawl-times.yml で別実行
          # NPCは1リクエストで全国分が返る単発取得なので、既定の6時間キャッシュに
          # 当たると1時間おきに回しても6回に5回が空振りする。ここでは無効にする。
          PAGE_CACHE_MS: "0"
      - run: npm run dashboard # 最新データで dashboard.html を再生成（全社分を集計）
      - run: npm run export # 統一料金CSV(data/parking-latest.csv)を再生成
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # prices.jsonl（価格時系列）と repark-crawl-state.json（巡回位置）を永続化。
          # 状態をコミットしないとローリングが毎回先頭に戻ってしまう。
          git add data/prices.jsonl data/repark-crawl-state.json data/repark-sitemap.xml dashboard.html data/parking-latest.csv
          # 満空は data/vacancy-YYYY-MM.jsonl（月ごと）。古い月は変わらないのでgitが太らない。
          # 月初の1回目はまだ無いことがあるので、拾えなくても止めない。
          git add data/vacancy-*.jsonl data/vacancy-lots.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update npc+repark prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
