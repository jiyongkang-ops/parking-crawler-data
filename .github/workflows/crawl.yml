# クラウド定期実行（GitHub Actions）
# この2社だけは満空（空車/混雑/満車）が取れるので、1時間おきに回す。
#   - NPC全国: 毎回 約1,700件を1リクエストで取得 → 24時間×7曜日がそのまま埋まる
#   - repark全国: 毎回 約630件をローリング巡回（config.reparkRollingCycleRuns=25）
#
# なぜ細かく回すのか:
#   在車率は時間帯と曜日で大きく変わる。1日3回（9/15/21時）のままだと同じ物件を
#   いつも似た時刻に見ることになり、平均が昼の顔に寄る。
#   ただし GitHub の定時実行は混雑時に2〜3時間ずれる（実測）ので、実行時刻には頼らない。
#   リパークは「今の時刻をまだ見ていない物件」から先に回す（pickRolling の spreadHours）。
#   いつ走ろうと24時間ぶんの穴が順に埋まる。
#   （2026-09-21: Cloud Scheduler が毎時確実に起動するようになったので、1回の実行を
#    2回に分ける対策はやめた。分割したままだと1回が70分を超え、毎時に収まらない）
#
# 先方への負荷は増やしていない。1日あたりの件数はほぼ同じ（13,500→約15,100件）で、
# まとめて3.3時間叩くのをやめ、1時間に約630件へならしている（山が低くなる）。
# 収集結果と巡回状態(data/)に変化があればコミットして次回に引き継ぐ。
name: crawl-parking-prices

# 起動は Cloud Scheduler（poc-aimo / asia-northeast1 の crawl-parking-vacancy-hourly、
# 毎時07分JST）から workflow_dispatch で行う。GitHub の cron は毎時のはずが1日5〜10回しか
# 発火せず（実測 2026-09-15）、時間帯に穴が空いたため。両方を生かすと起動が重なって
# concurrency でどちらかがキャンセルされるので、cron は止めてある。
# 2026-10-18〜: ほかの巡回（タイムズ・エコロ・ナビパーク・名鉄協商・NPC の満空・キョウテクほか・カーシェアーズ・publish）も、
# このワークフローの dispatch ジョブ（いちばん下）が JST の決まった時刻に起動する。時刻表と守りはそこに書いた。
on:
  workflow_dispatch: {} # Cloud Scheduler と手動実行から

permissions:
  contents: write
  # 巡回の起動に要る actions: write は、起動を受け持つ dispatch ジョブだけに付ける（2026-10-18〜）

jobs:
  crawl:
    runs-on: ubuntu-latest
    # リパークは取得50分（下の ROLLING_BUDGET_MIN。クローラ側で切り上げる）＋前後の処理。ここは余裕を見る。
    # concurrency で重複は起きない。1回の実行を2回に分ける（25分の待ち）のは 2026-09-21 にやめたので、待ちは足さない。
    # （2026-10-17 コメントだけ実態に合わせた。以前は「45分の予算・2回に分ける・100分」と書いていた）
    # タイムズの巡回は下で起動するだけで、別のジョブ（crawl-times.yml・90分）で動くのでここの時間には入らない
    timeout-minutes: 70
    concurrency:
      group: crawl # 多重起動を防ぐ（節度）
      cancel-in-progress: false
    steps:
      # タイムズなどの巡回の起動は、下の dispatch ジョブで行う（2026-10-18〜。それまではここに手順があり、
      # gh の起動に失敗するとこの手順が失敗して、毎時の巡回（NPC・リパーク）ごと止まるおそれがあった）
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # レポートスタジオから「厚く見てほしい物件」（登録現場と直近のレポート地点の500m圏、約500件）を受け取る。
      # これらは3時間おきに取る（ROLLING の別枠）。取れなければ前回コミットした一覧をそのまま使う。
      # タイムズ（crawl-times.yml）はここでコミットした一覧を読む。番号は BUK… で、巡回側でページのURLに読み替える。
      # タイムズは1日3回なので、優先物件はおおむね1日1回（config.js の timesPriorityMinAgeHours=20。2026-10-17）。
      - name: fetch priority lots from report studio
        env:
          KEY: ${{ secrets.STUDIO_PRIORITY_KEY }}
        run: |
          if [ -n "$KEY" ] && curl -sf --max-time 60 -H "x-cron-key: $KEY" \
               https://advisor.aimo-parking.com/api/cron/priority-lots -o /tmp/priority.json \
             && node -e "const j=require('/tmp/priority.json'); if(!j.byOp) process.exit(1); console.log('priority', JSON.stringify(j.counts))"; then
            mv /tmp/priority.json data/priority-lots.json
          else
            echo "優先一覧を取れなかったので前回のものを使う（$(test -f data/priority-lots.json && echo あり || echo なし)）"
          fi
      # exec で node を手順のいちばん上のプロセスにする（中身は package.json の crawl と同じ）。ランナーは時間切れ・取り消しのとき
      # 手順のいちばん上にだけ SIGINT を送るので、npm run crawl だと node に届かず、止めた後も取得と満空の共有ファイルへの追記が続く
      # （2026-10-18 点検。7本の巡回は fix/workflow-always で直し、ここと crawl-npc.yml も同じ形にした）。
      # node は SIGINT を受けると、そこまでの巡回状態と health（巡回全体 NG）を書いてすぐ終わる（src/run.js の最後）
      - run: exec node src/run.js
        # ジョブの時間切れ（70分）より10分早く巡回を止め、下のコミットの手順の時間を残す。
        # ふだんの所要は約50分（ROLLING_BUDGET_MIN の50分で切り上げる。2026-10 の直近60回で最長50.1分）で、
        # 前の手順（約1分）とコミットの手順（直近60回で最長3.0分）を足しても、ジョブの70分の手前で終わる
        timeout-minutes: 60
        env:
          CRAWL_ONLY: "npc,repark" # タイムズは crawl-times.yml で別実行
          # 取得の予算。毎時の間隔60分に収める（前後の処理と npm ci で数分かかる）。
          # 優先物件（約520件×4秒≒35分）は3時間おきなので、その回は全国ローリングに
          # 回る時間が減る。レポートで見ている周りを優先するほうが価値が高いので、それでよい
          ROLLING_BUDGET_MIN: "50"
          # 2026-09-21: 1回の実行を2回に分ける（間25分）のをやめ、1回に戻した。
          # これは GitHub の cron が24時間中18時間しか発火しなかった頃の対策だが、
          # いまは Cloud Scheduler が毎時きっちり起動しており（実測で24時間すべて発火）、
          # 分割の必要がない。分割したままだと1回の実行が「取得45分＋待ち25分」で
          # 70分を超え、毎時の間隔60分に収まらない。concurrency で次の回が待たされ、
          # 待ち時間が1時間あたり約6分ずつ積み上がって、3回に1回が取りこぼされていた
          # （実測: 直近40回のうち4回がキャンセル。所要が82分→124分へ単調増加）。
          ROLLING_PASSES: "1"
          # NPCは1リクエストで全国分が返る単発取得なので、既定の6時間キャッシュに
          # 当たると1時間おきに回しても6回に5回が空振りする。ここでは無効にする。
          PAGE_CACHE_MS: "0"
      # dashboard.html（14MB）と parking-latest.csv（17MB）は publish.yml で1日1回作る。
      # 毎時作り直してコミットすると、派生物だけで git が月75MB太る
      - name: commit data if changed
        # 途中で殺されても、そこまでの満空と巡回状態は残す（次回に同じ物件を叩き直さない）
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 巡回（node）が残っていたら止めてから git add する。ふつうは上の exec で巡回の手順と一緒に終わっているが、
          # 残っていると git pull の間も満空の共有ファイル（data/vacancy-<日付>.jsonl）に追記し続け、pull とコミットが失敗する（2026-10-18 点検）
          if pkill -INT -f 'node src/run.js'; then
            for i in $(seq 1 20); do pgrep -f 'node src/run.js' >/dev/null || break; sleep 1; done
            pkill -KILL -f 'node src/run.js' || true
          fi
          # prices.jsonl（価格時系列）と repark-crawl-state.json（巡回位置）を永続化。
          # 状態をコミットしないとローリングが毎回先頭に戻ってしまう。
          # .fetched は「一覧をいつ取り直したか」の記録。残さないと毎回作り直しになる
          git add data/prices.jsonl data/repark-crawl-state.json data/repark-sitemap.xml data/*.fetched
          # リパークの地図の一覧（src/repark-map.js。週1回作り直す）。残さないと毎時の回で作り直しになり、毎時約100回を送ってしまう。
          # 地図を使わない設定（REPARK_MAP_MAX_REQUESTS=0）のときは無いので、拾えなくても止めない
          git add data/repark-map-ids.txt 2>/dev/null || true
          # 満空は data/vacancy-YYYY-MM-DD.jsonl（日ごと。2026-09 までは月ごと）。古い日は変わらないのでgitが太らない。
          # 月初の1回目はまだ無いことがあるので、拾えなくても止めない。
          git add data/vacancy-*.jsonl data/vacancy-lots.jsonl data/priority-lots.json data/health/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update npc+repark prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi

  # ── 巡回の起動（2026-10-18〜） ──────────────────────────────────────────
  # 毎時確実に動くこのワークフロー（Cloud Scheduler から毎時07分JST）から、ほかの巡回を JST の決まった時刻に
  # workflow_dispatch で起動する。GitHub の cron は混むと3〜10時間遅れて始まり、正時（:00）の枠は落ちることもあった
  # （2026-10-04〜10-17 の14日で、予定の回数に対して エコロ 32/42回・ナビパーク 33/42回・名鉄協商とザ・パーク 32/42回・
  #   NPC の満空 44/56回。キョウテクほか・カーシェアーズ・publish は回数は足りていたが3〜10時間遅れていた）。
  # タイムズは 2026-09-27 からこのやり方（2026-10-18 までは crawl ジョブの先頭の手順だった）。
  #
  # 起動するもの（JST の時。起動は07分ごろ）。回数はもとの cron のまま、時刻はもとの cron（UTC）にいちばん近い時:
  #   crawl-others.yml     10・16・22時        もとは "0 1,7,13"     = 10:00・16:00・22:00
  #   crawl-npc.yml        4・10・16・22時     もとは "13 1,7,13,19" = 4:13・10:13・16:13・22:13
  #   crawl-navipark.yml   11・17・23時        もとは "0 2,8,14"     = 11:00・17:00・23:00
  #   crawl-extra.yml      11・23時            もとは "30 2,14"      = 11:30・23:30
  #   crawl-ecolo.yml      1・13・19時         もとは "0 4,10,16"    = 13:00・19:00・1:00
  #   crawl-extra2.yml     2・14時             もとは "30 5,17"      = 14:30・2:30
  #   crawl-extra3.yml     5・17時             もとは "30 8,20"      = 17:30・5:30
  #   crawl-carshares.yml  3時                 もとは "0 18"         = 3:00（1巡が終わって7日たつまでは何もせず終わる）
  #   publish.yml          6時                 もとは "40 21"        = 6:40（studio-data の7:30より前にするため、7時ではなく6時）
  #   crawl-times.yml      1日3回・日ごとにずらす（下の times_hours。2026-10-17〜の時間割のまま）
  # どのワークフローも schedule（cron）は外した。両方あると同じ回が2回起動され、concurrency で続けて走る（負荷が増える）。
  # cron のまま残しているワークフローは、このリポジトリには無い（README の「定期実行の起動」）。
  #
  # 守り:
  #   - crawl ジョブとは別のジョブにした（needs でつながない）。起動に失敗しても毎時の巡回は止まらない。
  #     失敗は ::warning:: にして、このジョブも成功で終える
  #   - 前の時の巡回が長引いて crawl ジョブが順番待ちになっても、起動は07分に行う
  #     （順番待ちのまま次の時の起動に取り消されても、その時の起動は済んでいる）
  #   - 同じ回を2回起動しない: その時（正時から）にもう起動されていれば起動しない（手での実行・Cloud Scheduler の二重の起動）
  #   - 起動されなかった回（Cloud Scheduler の抜け・gh の失敗）は、2時間あとまでの毎時の回で1回だけ取り戻す。
  #     起動済みかを確かめられないとき（gh run list の失敗）は、二重に起動しないよう取り戻さない
  #   - 同じワークフローの回と回の間（6時間以上）は、そのジョブの時間切れ（最長350分）より長いので、ふつうは前の回が終わっている。
  #     前の回が残っていても、各ワークフローの concurrency（cancel-in-progress: false）で終わるのを待ってから走る（重ならない）
  # 先方への負荷: 1日の起動の回数はもとの cron の予定どおりで、増えない（取り戻すのは起動されなかった回の分だけ）。
  #
  # タイムズの時間割（2026-09-27〜。もとは crawl ジョブの先頭にあった説明）:
  #   GitHub の cron は約5時間遅れて始まり、タイムズの満空が日中に1回も取れていなかった
  #   （JST 17〜18・22〜0・3〜4時だけ。2026-09-27 確認）。毎時確実に動くこの巡回から起動する。
  #   1回の巡回は45分で切り上げていたので、10・14・21時に固定すると満空がその3つの時間帯にしか付かなかった。
  #   2026-10-01〜: 8時間おき・毎日1時間ずつずらす（8日で24時間が一巡）。
  #   2026-10-17〜: 昼と夕方を厚くする（本人指示「直して」）。それまでの観測は昔の固定（10・14・21時）のなごりで、
  #     いちばん混む12〜13時が全体の1〜2%しかなかった。1日3回のうち
  #       昼   9〜14時 … 6日で一巡（(D+5)%6）
  #       夕方 15〜20時 … 昼のちょうど6時間後
  #       夜〜朝 21〜翌8時 … 12日で一巡（(7D+11)%12 番目。毎日7つずつ進めて、前の日の回と近づかないようにする）
  #     これで回と回の間はいつも6時間以上（最長19時間）、どの時間帯にも7つの曜日が回ってくる（1年を総当たりで確認）。
  #     一巡の日数を7の倍数にしないので、同じ時間帯が同じ曜日ばかりにならない。回数は1日3回のままで先方の負荷は変わらない。
  #   2026-10-17〜: タイムズの1回を45分から90分にした（crawl-times.yml の ROLLING_BUDGET_MIN。本人の了解「負荷は今の約2倍」）。
  #     上の時間割は回と回の間が最短6時間なので、90分（ジョブ全体でも最大120分）でも前の回と重ならない
  #     （2026-10-17〜2028-12-31 を計算: 間は6・7・8・12・13・19時間のどれか。年またぎも6時間以上）。
  # 確かめ: test/dispatch-schedule.test.js（下の手順をそのまま bash で動かし、gh と date を差し替えて数える）
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write   # gh workflow run で起動し、gh run list で起動済みかを見る（GITHUB_TOKEN からの workflow_dispatch は起動できる）
      contents: read
    concurrency:
      group: crawl-dispatch   # 手での実行と重なっても、確かめと起動を1つずつ行う（同じ回を2回起動しない）
      cancel-in-progress: false
    steps:
      - name: dispatch crawls due this hour (JST)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e   # 起動の失敗でこの手順を止めない（残りも起動し、失敗は ::warning:: にして成功で終える）
          # 時刻表（ワークフロー と JST の時）。上のコメントの表と同じ。回数はもとの cron のまま
          FIXED='crawl-others.yml 10 16 22
          crawl-npc.yml 4 10 16 22
          crawl-navipark.yml 11 17 23
          crawl-extra.yml 11 23
          crawl-ecolo.yml 1 13 19
          crawl-extra2.yml 2 14
          crawl-extra3.yml 5 17
          crawl-carshares.yml 3
          publish.yml 6'
          # 起動されなかった回を、何時間あとまで取り戻すか（同じワークフローの回と回の間＝6時間以上より短くする）
          LOOKBACK=2
          times_hours() {   # $1=JST の通し日（1〜366）→ タイムズを起動する3つの時（2026-10-17〜の時間割。式は前と同じ）
            D=$1
            A=$(( 9 + (D + 5) % 6 )); B=$(( A + 6 )); C=$(( (21 + (7 * D + 11) % 12) % 24 ))
            echo "$A $B $C"
          }
          due_at() {   # $1=JST の通し日 $2=JST の時 → その時に起動するワークフロー（1行に1つ）
            for X in $(times_hours "$1"); do if [ "$X" -eq "$2" ]; then echo crawl-times.yml; fi; done
            echo "$FIXED" | while read -r WF HOURS; do
              for X in $HOURS; do if [ "$X" -eq "$2" ]; then echo "$WF"; fi; done
            done
            return 0
          }
          NOW=$(date +%s)
          D0=$(TZ=Asia/Tokyo date -d "@$NOW" +%-j)
          echo "JST $(( (NOW / 3600 + 9) % 24 ))時の起動（今日のタイムズは $(times_hours "$D0" | sed 's/ /・/g')時）"
          SEEN=" "
          for K in $(seq 0 "$LOOKBACK"); do
            T=$(( NOW - K * 3600 ))
            SLOT=$(( T - T % 3600 ))   # その時の始まり（日本時間は UTC と9時間ちょうどの差なので、正時は同じ）
            D=$(TZ=Asia/Tokyo date -d "@$T" +%-j); H=$(( (T / 3600 + 9) % 24 ))
            SINCE=$(date -u -d "@$SLOT" +%Y%m%d%H%M%S)
            for WF in $(due_at "$D" "$H"); do
              case "$SEEN" in *" $WF "*) continue ;; esac   # いちばん近い回だけを見る
              SEEN="$SEEN$WF "
              WHEN="JST ${H}時の回"
              # その時の始まりより後に起動された回を数える（起動のしかたは問わない）。時刻は 2026-10-18T14:07:05Z の形
              if LIST=$(gh run list -R "$GITHUB_REPOSITORY" -w "$WF" -L 10 --json createdAt --jq '.[].createdAt'); then
                N=0
                for AT in $LIST; do
                  AT=${AT//[^0-9]/}; AT=${AT:0:14}
                  if [ "${#AT}" -ne 14 ]; then N=unknown; break; fi
                  if [ "$AT" -ge "$SINCE" ]; then N=$(( N + 1 )); fi
                done
              else
                N=unknown
              fi
              if [ "$N" = unknown ]; then
                if [ "$K" -gt 0 ]; then
                  echo "::warning::${WF}（${WHEN}）: 起動済みかを確かめられないので、取り戻しの起動はしません（二重に起動しないため）"
                  continue
                fi
                echo "${WF}（${WHEN}）: 起動済みかを確かめられませんでしたが、この時の回なので起動します"
              elif [ "$N" -gt 0 ]; then
                if [ "$K" -eq 0 ]; then echo "${WF}（${WHEN}）: この時の回はもう起動されています。起動しません"; fi
                continue
              elif [ "$K" -gt 0 ]; then
                echo "::warning::${WF}（${WHEN}）が起動されていなかったので、いま起動します（${K}時間遅れ）"
              fi
              if gh workflow run "$WF" --ref main -R "$GITHUB_REPOSITORY"; then
                echo "起動しました: ${WF}（${WHEN}）"
              elif [ "$K" -lt "$LOOKBACK" ]; then
                echo "::warning::${WF}（${WHEN}）を起動できませんでした。次の時の回でもう一度試します"
              else
                echo "::warning::${WF}（${WHEN}）を起動できませんでした。取り戻せる時間（${LOOKBACK}時間）を過ぎたので、この回は動きません"
              fi
            done
          done
          exit 0
