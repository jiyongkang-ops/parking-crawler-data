# 2026-08 追加分の定期実行（タマパーク他9社）
# 出力は別ファイル(prices-extra3.jsonl)にして push 競合を回避。
name: crawl-extra3

on:
  schedule:
    # 他ワークフローとずらして 8:30,20:30 UTC（1日2回）
    - cron: "30 8,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl-extra3:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: crawl-extra3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run crawl
        env:
          CRAWL_ONLY: "tamapark,anabuki,mden,kintetsu,tokyulifia,seiwapark,systempark,comnet,keio,odakyu"
          OUT_FILE: "data/prices-extra3.jsonl"
      - name: commit data if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/prices-extra3.jsonl data/tamapark-ids.txt data/tamapark-crawl-state.json data/anabuki-ids.txt data/anabuki-crawl-state.json data/kintetsu-ids.txt data/kintetsu-crawl-state.json data/tokyulifia-ids.txt data/tokyulifia-crawl-state.json data/seiwapark-ids.txt data/seiwapark-crawl-state.json data/systempark-ids.txt data/systempark-crawl-state.json data/comnet-ids.txt data/comnet-crawl-state.json data/keio-ids.txt data/keio-crawl-state.json data/odakyu-ids.txt data/odakyu-crawl-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update extra3 prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
