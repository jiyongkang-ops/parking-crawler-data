# NPCの満空だけを、時間帯をまたいで採る（GitHub Actions）
#
# なぜ要るか:
#   NPCは1リクエストで全国約1,700件ぶんの満空が返る。満空の観測の8割はここから来る。
#   ところが GitHub の定時実行は混んでいると3〜5時間ずれ、1時間おきに指定しても
#   1日5〜6回しか走らない（実測: 00:03 → 04:58 → 10:22 → 14:30）。
#   実行時刻がそのまま観測時刻になるNPCでは、24時間のうち10時間が空のままだった。
#
# どうするか:
#   実行時刻に頼らず、**1回の実行の中で間隔をあけて繰り返し取る**。
#   27分おきに11回＝1回の実行で約4.5時間ぶんの時間帯が埋まる。
#   これを1日4回まわすと、遅延があっても1日のほとんどの時間帯に届く。
#   27分は60の約数ではないので、分の位置も回るたびにずれる。
#
# 先方への負荷:
#   増えるのは1日あたり約44リクエスト（従来は5〜6）。JSONの一覧が1本返るだけの口で、
#   27分あける直列実行。他社の詳細ページ巡回（1日15,000件規模）に比べれば桁違いに軽い。
name: crawl-npc

# 起動は crawl.yml の dispatch ジョブ（Cloud Scheduler から毎時07分JST）が、JST 4・10・16・22時に workflow_dispatch で行う
# （2026-10-18〜）。両方あると同じ回が2回走るので cron は外した（時刻表と守りは crawl.yml の dispatch ジョブ）。
# 1回が約4.5時間なので、6時間おきに始めれば重ならない（ジョブの時間切れ330分も6時間より短い）。
# それまでの GitHub の cron（"13 1,7,13,19 * * *" = JST 4:13・10:13・16:13・22:13）は中央値で約4時間（長いと約6時間）遅れて始まり、
# 1日2〜3回しか走らない日があった（2026-10-04〜10-17 の14日で予定56回のうち44回。満空の行は2回の日が約7.3万行、4回の日が約10.9万行）。
on:
  workflow_dispatch: {} # crawl.yml の dispatch ジョブと手動実行から

permissions:
  contents: write

jobs:
  crawl-npc:
    runs-on: ubuntu-latest
    # 27分 × 11回 = 約4.5時間。GitHub の上限6時間の手前で打ち切る
    timeout-minutes: 330
    concurrency:
      group: crawl-npc
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # exec で node を手順のいちばん上のプロセスにする（中身は package.json の crawl と同じ）。ランナーは時間切れ・取り消しのとき
      # 手順のいちばん上にだけ SIGINT を送るので、npm run crawl だと node に届かず、止めた後も満空の共有ファイルへの追記が続く
      # （2026-10-18 点検。7本の巡回は fix/workflow-always で直し、ここと crawl.yml も同じ形にした）。
      # node は SIGINT を受けると、health（巡回全体 NG）を書いてすぐ終わる（src/run.js の最後）
      - run: exec node src/run.js
        # ジョブの時間切れ（330分）より10分早く巡回を止め、下のコミットの手順の時間を残す。
        # ふだんの所要は約270.5分（27分 × 10回の待ち＋11リクエスト。2026-10 の直近100回で同じ）
        timeout-minutes: 320
        env:
          CRAWL_ONLY: "npc"
          NPC_REPEAT: "11"
          NPC_INTERVAL_MIN: "27"
          # 6時間キャッシュに当たると1回目から空振りする
          PAGE_CACHE_MS: "0"
          # 料金は本体(crawl.yml)が持つ。ここでは料金を書かず満空だけ残す。
          # 別ファイルに料金を書くと NPC の料金時系列が2本になり、変動が二重に数えられる
          VACANCY_ONLY: "1"
      - name: commit data if changed
        if: always()   # 途中で殺されても、そこまでの観測は残す
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 巡回（node）が残っていたら止めてから git add する。ふつうは上の exec で巡回の手順と一緒に終わっているが、
          # 残っていると git pull の間も満空の共有ファイル（data/vacancy-<日付>.jsonl）に追記し続け、pull とコミットが失敗する（2026-10-18 点検）
          if pkill -INT -f 'node src/run.js'; then
            for i in $(seq 1 20); do pgrep -f 'node src/run.js' >/dev/null || break; sleep 1; done
            pkill -KILL -f 'node src/run.js' || true
          fi
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: npc vacancy across hours ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 6); do
              if ! git pull --no-rebase --no-edit origin main; then
                # 追記レースの衝突: jsonlはunionマージで自動解決、残り(状態ファイル等)は自分側を採用
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                git add -A
                git commit --no-edit
              fi
              if git push; then echo "pushed"; break; fi
              echo "push retry $i"; sleep $((RANDOM % 8 + 3))
              [ "$i" = 6 ] && { echo "push failed after retries"; exit 1; }
            done
          else
            echo "変化なし。コミットしません。"
          fi
